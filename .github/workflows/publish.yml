name: Authorized npm release
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type PUBLISH to authorize this release
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: inputs.approval == 'PUBLISH' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - name: Verify selected tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)process.exit(1)"
      - run: npm publish --access public --provenance
